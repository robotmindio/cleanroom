    vertices:
      # bench sits where the robot actually powers on: the driver's odometry
      # origin. Without a vertex here EasyFullControl never considers the idle
      # robot localized, and keeps dispatching go_to_place to drag it onto the
      # nearest lane -- forever, since Nav2 cannot plan out of the clutter
      # around the bench.
      - [0.0, 0.0, {is_parking_spot: true, name: bench}]
      - [-4.0, -2.5, {is_charger: true, is_parking_spot: true, name: charger}]
      - [-3.0, 0.0, {name: west_corridor}]
      - [-0.5, -1.8, {name: doorway}]
      - [2.0, -1.8, {name: east_corridor}]
      - [4.0, -2.0, {name: dropoff}]
