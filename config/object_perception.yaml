/**:
  ros__parameters:
    # Open-vocabulary Grounding DINO on the RobotMind GPU provider; while it is unreachable or answers
    # outside its pinned identity, the local CPU RT-DETR serves frames under its own model_sha256.
    model_name: grounding_dino_tiny_gpu
    fallback_model_name: rtdetr_v2_r18
object_detector:
  ros__parameters:
    max_rate_hz: 2.0
    max_source_age_sec: 2.0
object_observations:
  ros__parameters:
    max_source_age_sec: 2.0
    max_records: 100000
    max_bytes: 2147483648
    retention_sec: 604800.0
