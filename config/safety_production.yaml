safety_supervisor:
  ros__parameters:
    publish_frequency: 20.0
    sensor_timeout: 0.50
    # Filtered Astra clouds arrive at <=3 Hz; observed compute gaps reach 0.71 s.
    # Keep the scan deadline short while matching the arm monitor's 1 s cloud gate.
    depth_timeout: 1.0
    state_timeout: 1.25
    # The motor host freezes motion after 0.5 s without commands. Allow a
    # short compute scheduling pause without repeatedly disarming/re-arming.
    permission_timeout: 1.0
    battery_timeout: 2.0
    require_driver_state: true
    require_acceptance: true
    require_scan: true
    require_full_scan: true
    # The current 100 deg body mask leaves 260 deg of measured scan coverage.
    # The 4.3 rad threshold leaves about 14 deg for scan-span variation.
    minimum_scan_coverage: 4.3
    minimum_scan_valid_fraction: 0.05
    require_depth: true
    minimum_depth_valid_points: 16
    minimum_depth_valid_fraction: 0.01
    minimum_depth_range: 0.05
    maximum_depth_range: 10.0
    # Missing, stale, or unhealthy sensor inputs deny motion in strict mode.
    # Acceptance and a fresh measured arm stow remain hard base-motion gates
    # in both modes; MoveIt collision status always gates arm motion.
    #
    # The shipped robot has no bumper, IMU, or battery monitor, and its e-stop
    # cuts motor power outside the electronics, so nothing publishes
    # safety/bumper_active, /imu/data, /battery_state, or safety/estop_active.
    # Requiring them would keep strict mode denying motion forever. Set each
    # true only once real hardware publishes it (see docs/safety.md).
    require_bumper: false
    require_estop: false
    require_battery: false
    require_motor_health: true
    require_odometry: true
    require_imu: false
    require_joint_states: true
    # Arm motion remains denied until the execution-time MoveIt collision gate
    # is running. Because this requirement is arm-only, omitting MoveIt still
    # permits the independently healthy base scope to finish startup.
    require_arm_workspace: true
    arm_workspace_topic: /safety/arm_workspace_clear
    minimum_battery_voltage: 10.5
    minimum_battery_percentage: 0.15
    # Planned forward stow candidate; physical clearance and stopping acceptance
    # remain unverified, so autonomous base acceptance remains false.
    stow_tolerance: 0.02
    stow_joint_names:
      - arm_shoulder_pan
      - arm_shoulder_lift
      - arm_elbow_flex
      - arm_wrist_flex
      - arm_wrist_roll
      - arm_gripper
    # Collision-checked forward pose; gripper zero is the calibrated contact pose.
    stow_joint_positions: [-0.006, 1.0, -1.0, 0.0, -0.02, 0.0]

arm_workspace_monitor:
  ros__parameters:
    group_name: arm
    joint_names:
      - arm_shoulder_pan
      - arm_shoulder_lift
      - arm_elbow_flex
      - arm_wrist_flex
      - arm_wrist_roll
      - arm_gripper
    check_frequency: 30.0
    # Observed host feedback gaps reach 0.43 s; its independent 0.5 s command
    # watchdog freezes the arm if commands stop before this lease expires.
    joint_timeout: 0.75
    perception_timeout: 1.0
    validity_timeout: 0.35
    service_timeout: 0.25
