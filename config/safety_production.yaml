safety_supervisor:
  ros__parameters:
    publish_frequency: 20.0
    sensor_timeout: 0.50
    # Compact clouds target 10 Hz. After fixing Pi DDS buffers and Wi-Fi,
    # the measured maximum compute gap was 0.173 s over 60 s.
    depth_timeout: 0.50
    state_timeout: 0.75
    permission_timeout: 0.5
    battery_timeout: 2.0
    require_driver_state: true
    require_acceptance: true
    require_scan: true
    require_full_scan: true
    # The current 100 deg body mask leaves 260 deg of measured scan coverage.
    # The 4.3 rad threshold leaves about 14 deg for scan-span variation.
    minimum_scan_coverage: 4.3
    minimum_scan_valid_fraction: 0.05
    require_depth: true
    minimum_depth_valid_points: 16
    minimum_depth_valid_fraction: 0.01
    minimum_depth_range: 0.05
    maximum_depth_range: 10.0
    # Required base inputs, acceptance and fresh stow gate base motion in both
    # modes. Hold mode recovers permission when inputs recover, without disarming.
    # MoveIt collision status always gates arm motion.
    #
    # The shipped robot has no bumper, IMU, or battery monitor, and its e-stop
    # cuts motor power outside the electronics, so nothing publishes
    # safety/bumper_active, /imu/data, /battery_state, or safety/estop_active.
    # Requiring them would keep strict mode denying motion forever. Set each
    # true only once real hardware publishes it (see docs/safety.md).
    require_bumper: false
    require_estop: false
    require_battery: false
    require_motor_health: true
    require_odometry: true
    require_imu: false
    require_joint_states: true
    # Arm motion remains denied until the execution-time MoveIt collision gate
    # is running. Because this requirement is arm-only, omitting MoveIt still
    # permits the independently healthy base scope to finish startup.
    require_arm_workspace: true
    arm_workspace_topic: /safety/arm_workspace_clear
    minimum_battery_voltage: 10.5
    minimum_battery_percentage: 0.15
    # Physically accepted compact fold. Base permission also requires healthy
    # inputs and the matching recorded footprint/stopping acceptance.
    stow_tolerance: 0.02
    stow_joint_names:
      - arm_shoulder_pan
      - arm_shoulder_lift
      - arm_elbow_flex
      - arm_wrist_flex
      - arm_wrist_roll
      - arm_gripper
    # Captured compact fold: wrist camera downward, fixed mapping cameras clear.
    stow_joint_positions: [0.0, -1.8167, 1.6295, 1.2367, -0.0169, 0.2095]

arm_workspace_monitor:
  ros__parameters:
    group_name: arm
    joint_names:
      - arm_shoulder_pan
      - arm_shoulder_lift
      - arm_elbow_flex
      - arm_wrist_flex
      - arm_wrist_roll
      - arm_gripper
    check_frequency: 30.0
    # Host feedback targets 10 Hz but measured serial/transport hiccups reach
    # 0.40 s. Bound tolerance below the motor host's 0.50 s command watchdog.
    joint_timeout: 0.45
    perception_timeout: 0.50
    validity_timeout: 0.15
    service_timeout: 0.10
