# Lenovo is the split robot's LAN time reference.
pool ntp.ubuntu.com iburst maxpoll 6
allow 192.168.110.0/24
# The same device can follow this reference when the compute host changes LAN.
allow 100.107.20.66/32
driftfile /var/lib/chrony/chrony.drift
rtcsync
# Slew corrections: clock steps can invalidate live sensor timestamps.
