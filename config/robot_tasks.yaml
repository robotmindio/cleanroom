# lekiwi_rmf/task_gateway.py: the arm capabilities of the task API. All stay false on the
# physical robot until the arm trials in DEFERRED.md pass; enabling one is an operator decision
# made here, never a parameter set after startup.
robot_tasks:
  ros__parameters:
    # `skill`: qualified entries of config/robot_skills.yaml, run by the skill runner.
    allow_skills: false
    # `reach`: a joint target planned and executed by MoveIt's MoveGroup (needs start_moveit).
    allow_reach: false
    # `gripper`: an SRDF gripper state or a claw position, through the same MoveGroup path as `reach`.
    allow_gripper: false
