astra_cloud_filter:
  ros__parameters:
    # QVGA depth at 30 Hz yields a useful sparse arm cloud without sending the
    # raw raster. Sample every 8 pixels per axis; keep all finite returns when
    # a sparse frame fits that same point budget. A 10 Hz compact cloud keeps
    # safety observations timely without increasing the RGB/depth image rate.
    pixel_stride: 8
    max_rate_hz: 10.0
    # Pair capture stamps within 50 ms before applying this shared image rate.
    image_max_rate_hz: 2.0
    # Bound RGB traffic even when Tailscale has to relay the sensor connection.
    jpeg_quality: 70
