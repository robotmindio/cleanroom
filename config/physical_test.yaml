# Finite attended characterization; this never grants physical acceptance.
camera: v4l2_input.pci-0000_04_00.3-usb-0_2.1.2_1.0
image_size: [1280, 960]
marker_ids: [53, 69, 59]
marker_side_m: 0.035
# Operator measured the black floor-marker square, excluding its white margin.
floor_marker_id: 33
floor_marker_side_m: 0.044
maximum_linear_speed_m_s: 0.04
maximum_angular_speed_rad_s: 0.08
linear_steps_m_s: [0.04]
angular_steps_rad_s: [0.08]
trials_per_direction: 30
trial_displacement_m: 0.030
trial_rotation_rad: 0.12
# Recentered three-marker view accommodates the pulse and stopping excursion.
# This is a measurement boundary; the StopZone's 5 cm budget below is unchanged.
maximum_optical_displacement_m: 0.08
# Protect the authorized chassis-center radius even if the camera's reference
# lies up to 20 cm away from that center and the base rotates during a trial.
marker_center_offset_bound_m: 0.20
maximum_center_radius_m: 0.15
# At 0.04 m/s this bounds unobserved travel to 2 cm, inside the early radius
# margin. The preceding camera frame remains the conservative stop baseline;
# the stop is held for observation before any return command.
maximum_frame_age_s: 0.50
measurement_uncertainty_m: 0.010
# Predeclared budget: StopZone has 5 cm footprint clearance, including error.
maximum_stopping_distance_m: 0.050
maximum_stop_time_s: 1.5
maximum_runtime_s: 2400
