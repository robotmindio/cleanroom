robot_explorer:
  ros__parameters:
    # Idle until an explicit /robot/explore goal arrives.
    max_duration_sec: 900.0
    max_radius_m: 10.0
    # Inscribed centre prefilter; goals, paths and live poses use the oriented
    # Nav2 footprint rather than a circumscribed obstacle-clearance circle.
    clearance_m: 0.22
    observation_distance_m: 0.8
    target_spacing_m: 0.5
    revisit_spacing_m: 1.0
    free_threshold: 20
    max_map_cells: 250000
    data_timeout_sec: 1.0
    # Camera acquisition/transport plus gaps between status updates exceeded 2.5 s live.
    slam_timeout_sec: 4.0
    service_timeout_sec: 3.0
    navigation_timeout_sec: 180.0
    settle_sec: 1.0
    # Mapping quota: the session guard freezes the map (switches RTAB-Map to
    # localization) at whichever comes first. bringup's
    # rtabmap_mapping_max_bytes/_seconds arguments default to these values.
    mapping_max_bytes: 17179869184
    mapping_max_seconds: 14400.0
    # Active search (/robot/search) reuses this node's guarded Nav2 path and limits.
    # Off until the object perception operating point is qualified on the robot.
    allow_search: false
    search_max_travel_m: 60.0
    search_target_coverage: 0.9
    # Evidence of absence: an object of this size must span this many pixels,
    # the whole height band must be in view, and the camera must be stationary.
    search_min_object_m: 0.08
    # DEBT: uncalibrated default until scripts/calibrate-thresholds.py search fits it
    # from the recorded corpus (docs/threshold-calibration.md, cleanroom#88).
    search_min_object_px: 24.0
    search_max_range_m: 4.0
    search_min_height_m: 0.02
    search_max_height_m: 0.3
    # Objects move; older negative evidence is stale and searched again.
    search_max_age_sec: 900.0
    search_require_stationary: true
    # Heuristic utility = expected newly resolved cells / (travel + overhead).
    search_viewpoint_spacing_m: 0.5
    search_headings: 12
    search_max_candidates: 200
    search_viewpoint_overhead_m: 1.0
    search_min_gain_cells: 20.0
    search_prior_weight: 20.0
    # Replan when captures en route leave less than this share of the planned gain.
    search_replan_fraction: 0.5
    search_dwell_sec: 4.0
    search_perception_timeout_sec: 4.0
    search_capture_log: 2000
