robot_explorer:
  ros__parameters:
    # Idle until an explicit /robot/explore goal arrives.
    max_duration_sec: 900.0
    max_radius_m: 5.0
    # Inscribed centre prefilter; goals, paths and live poses use the oriented
    # Nav2 footprint rather than a circumscribed obstacle-clearance circle.
    clearance_m: 0.22
    observation_distance_m: 0.8
    target_spacing_m: 0.5
    revisit_spacing_m: 1.0
    free_threshold: 20
    max_map_cells: 250000
    data_timeout_sec: 1.0
    # Camera acquisition/transport plus gaps between status updates exceeded 2.5 s live.
    slam_timeout_sec: 4.0
    service_timeout_sec: 3.0
    navigation_timeout_sec: 180.0
    settle_sec: 1.0
    # Mapping quota: the session guard freezes the map (switches RTAB-Map to
    # localization) at whichever comes first. bringup's
    # rtabmap_mapping_max_bytes/_seconds arguments default to these values.
    mapping_max_bytes: 536870912
    mapping_max_seconds: 14400.0
