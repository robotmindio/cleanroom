# Nav2 parameters for the physical LeKiwi.  This intentionally does not inherit
# nav2_bringup's TurtleBot defaults: LeKiwi is holonomic and the driver clamps
# planar speed magnitude to 0.30 m/s and yaw to pi/2 rad/s.

amcl:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    robot_model_type: nav2_amcl::OmniMotionModel
    min_particles: 300
    max_particles: 1500
    max_beams: 60
    transform_tolerance: 0.5
    update_min_a: 0.10
    update_min_d: 0.10

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.10
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.15
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 40
      model_dt: 0.05
      batch_size: 1000
      iteration_count: 1
      motion_model: Omni
      vx_max: 0.30
      vx_min: -0.30
      vy_max: 0.30
      wz_max: 1.57
      ax_max: 0.60
      ax_min: -0.60
      ay_max: 0.60
      ay_min: -0.60
      az_max: 1.57
      vx_std: 0.12
      vy_std: 0.12
      wz_std: 0.35
      prune_distance: 1.5
      transform_tolerance: 0.2
      visualize: false
      regenerate_noises: true
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic, PathFollowCritic, PathAngleCritic, TwirlingCritic]
      ConstraintCritic:
        enabled: true
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_weight: 4.0
        critical_cost: 300.0
        near_collision_cost: 253
        consider_footprint: true
      GoalCritic:
        enabled: true
        cost_weight: 5.0
        threshold_to_consider: 1.0
      GoalAngleCritic:
        enabled: true
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_weight: 10.0
        offset_from_furthest: 10
        threshold_to_consider: 0.5
      PathFollowCritic:
        enabled: true
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.0
      PathAngleCritic:
        enabled: true
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
      TwirlingCritic:
        enabled: true
        twirling_cost_weight: 2.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      # Nav2 declares these dimensions as integer parameters before converting
      # them to metres internally; YAML floats make controller_server abort.
      width: 3
      height: 3
      resolution: 0.05
      # Complete measured stowed-robot envelope, not only the base plate. The
      # safety supervisor independently requires the arm to remain in stow.
      footprint: "[[0.22, 0.22], [0.22, -0.22], [-0.22, -0.22], [-0.22, 0.22]]"
      # The 0.32 m RMF/map-bundle circle encloses this 0.44 m square
      # (corner radius ~= 0.311 m). Extra Nav2 padding would make the live
      # envelope exceed the immutable map/RMF reservation envelope.
      footprint_padding: 0.0
      transform_tolerance: 0.3
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.35
        cost_scaling_factor: 5.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.22, 0.22], [0.22, -0.22], [-0.22, -0.22], [-0.22, 0.22]]"
      # See local_costmap: the tracked 0.32 m envelope includes this complete
      # 0.44 m square footprint without additional Nav2 padding.
      footprint_padding: 0.0
      transform_tolerance: 0.5
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.40
        cost_scaling_factor: 4.0

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.20
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, assisted_teleop, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    assisted_teleop:
      plugin: nav2_behaviors::AssistedTeleop
    wait:
      plugin: nav2_behaviors::Wait

waypoint_follower:
  ros__parameters:
    loop_rate: 10
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    scale_velocities: true
    max_velocity: [0.30, 0.30, 1.57]
    min_velocity: [-0.30, -0.30, -1.57]
    max_accel: [0.60, 0.60, 1.57]
    max_decel: [-0.60, -0.60, -1.57]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5

# The driver consumes only /cmd_vel_safe. Navigation's standard launch path is
# controller -> cmd_vel_nav -> smoother -> cmd_vel_smoothed. The repository mux
# combines that with /cmd_vel_manual, validates both, then this monitor is the
# only producer of the driver's final command topic.
collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_muxed
    cmd_vel_out_topic: /cmd_vel_safe
    state_topic: collision_monitor_state
    transform_tolerance: 0.3
    source_timeout: 0.75
    stop_pub_timeout: 1.0
    base_shift_correction: true
    polygons: [StopZone, SlowdownZone]
    StopZone:
      type: polygon
      # Initial conservative test value: 0.22 m stowed envelope + 0.075 m
      # ideal braking distance at 0.30 m/s and 0.60 m/s^2. This value must be
      # increased to include measured sensor/control latency and uncertainty
      # before physical acceptance; it must never be tuned only in RViz.
      points: "[[0.30, 0.30], [0.30, -0.30], [-0.30, -0.30], [-0.30, 0.30]]"
      action_type: stop
      min_points: 1
      visualize: true
      polygon_pub_topic: collision_stop_zone
      enabled: true
    SlowdownZone:
      type: polygon
      points: "[[0.45, 0.45], [0.45, -0.45], [-0.45, -0.45], [-0.45, 0.45]]"
      action_type: slowdown
      slowdown_ratio: 0.35
      min_points: 1
      visualize: true
      polygon_pub_topic: collision_slowdown_zone
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan
      enabled: true

# Jazzy navigation_launch always starts docking_server. Keep a standard dock
# plugin configured so its lifecycle transition succeeds, but declare no dock
# instances: this robot has no validated physical dock yet and RMF's idle mode
# intentionally holds position instead of issuing autonomous charge requests.
docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.10
    max_retries: 3
    base_frame: base_footprint
    fixed_frame: odom
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: [simple_charging_dock]
    simple_charging_dock:
      plugin: opennav_docking::SimpleChargingDock
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true

map_server:
  ros__parameters:
    frame_id: map
    topic_name: map
    yaml_filename: ""

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
