scan_self_filter:
  ros__parameters:
    # Re-measured 2026-09-27 over 200 raw scans with the robot stationary in the
    # current arm and camera configuration. A live scan on 2026-09-28 found
    # 0.221-0.227 m returns at 219-220 deg; the calibrated laser transform puts
    # them inside the +/-0.22 m base footprint, so the first range bound is 0.24 m.
    # It also found self-returns at 214.6 deg/0.16 m and 299.7-300.5 deg/0.162 m,
    # just outside the old sector edges. The short 299-301 deg sector covers the
    # latter without extending its reach outside the footprint. This is pose-specific:
    # remeasure after moving the arm, lidar, or hardware within 20 cm of it. Angles
    # are laser-frame degrees, counter-clockwise from +x. Each value is per sector.
    body_start_deg: [214.0, 254.0, 299.0, 315.0]
    body_end_deg: [233.0, 284.0, 315.0, 350.0]
    # Folded-arm verification 2026-10-03 found 0.188-0.194 m self-returns
    # around 300-302 deg, at base x=0.027-0.029, y=0.101-0.108 m.
    # A 200-scan replay also found 278.1 deg / 0.217 m, 1 mm beyond its bound.
    # Later scans found 0.213-0.225 m returns at 299.6-301.3 deg, still inside
    # the body. Split the same angular union at 315 deg: the first piece can
    # reach 0.26 m without crossing the footprint; the second stays at 0.205 m.
    # All added range remains inside the footprint; total scan coverage is unchanged.
    body_max_range_m: [0.24, 0.228, 0.26, 0.205]
