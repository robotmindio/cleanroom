scan_self_filter:
  ros__parameters:
    # Re-measured 2026-09-27 over 200 raw scans with the robot stationary in the
    # current arm and camera configuration, in the previously confirmed clear
    # test area. The measured self-returns are 215-233 deg (to 0.193 m),
    # 254-284 deg (to 0.196 m), and 301-350 deg (to 0.172 m); the 2 cm margins
    # below cover them. This is pose-specific: remeasure after moving the arm,
    # lidar, or any hardware within 20 cm of it. Angles are laser-frame degrees,
    # counter-clockwise from +x. Each parameter has one entry per sector.
    body_start_deg: [215.0, 254.0, 301.0]
    body_end_deg: [233.0, 284.0, 350.0]
    body_max_range_m: [0.213, 0.216, 0.192]
