ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.20
    two_d_mode: true
    transform_time_offset: 0.0
    # Odometry arrives at the driver's tick rate. Predicting to the current time
    # keeps odom->base_footprint at least as new as any device-stamped sensor
    # message that SLAM and Nav2 look up against it.
    predict_to_current_time: true
    transform_timeout: 0.10
    print_diagnostics: true
    publish_tf: true
    publish_acceleration: false
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /wheel/odometry
    # Wheel odometry supplies planar body velocity. Pose is deliberately not
    # fused back into the EKF because it is derived from the same velocities.
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 5
    odom0_differential: false
    odom0_relative: false

    # There is no IMU on this robot, so the filter fuses only wheel odometry.
    # When one is fitted, add it as imu0 fusing yaw rate only; absolute yaw
    # stays excluded until magnetic/environmental calibration is validated.
