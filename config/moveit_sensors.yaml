# Environmental collision input for MoveIt's occupancy-map monitor. The topic
# is a contract for the future calibrated depth pipeline; production arm motion
# remains denied by safety_production.yaml until fresh clouds are present.
sensors:
  - point_cloud
point_cloud:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /moveit/depth/points_ready
  max_range: 3.0
  point_subsample: 1
  padding_offset: 0.03
  padding_scale: 1.0
  # Compact clouds are already capped at 10 Hz on the Pi. A second throttle
  # discarded jittered ready frames and produced 0.6 s processed-cloud gaps.
  max_update_rate: 0.0
  filtered_cloud_topic: /moveit/filtered_cloud
