# Attended manual braking stages; these are test ceilings, not acceptance.
# Rotation is a provisional 2 rad/m ratio, to be replaced from measurements.
# Pure translation/rotation pulses fit the confirmed 1 m fixture. Even a stop
# at the driver boundary leaves 0.56 m: 0.30 * 1.15 * 1.5 + 0.04 = 0.5575 m.
# Slower coupled return commands need less obstacle clearance for the same time reserve.
# Production Nav2 speeds and physical acceptance remain unchanged.
bounds:
  maximum_stopping_distance_m: 0.65
  maximum_center_radius_m: 0.40
  independent_center_radius_m: 0.42
  driver_center_radius_m: 0.44
  required_clearance_m: 1.0
  # The first 0.30 pulse had 0.035362 m measured uncertainty; round up to 4 cm.
  measurement_uncertainty_m: 0.04
  # Allow acceleration before fitting the final 1 s of independent captures.
  nominal_command_duration_s: 1.6
  return_linear_speed_m_s: 0.04
  return_angular_speed_rad_s: 0.06
stages:
  '0.20':
    linear_speed_m_s: 0.20
    angular_speed_rad_s: 0.40
  '0.25':
    linear_speed_m_s: 0.25
    angular_speed_rad_s: 0.50
    # Held-fold scan-loss trial modeled 0.050424 m uncertainty; reserve 6 cm.
    measurement_uncertainty_m: 0.06
    # Held fold captured over 60 stationary samples; tolerance stays 0.02 rad.
    # CAD footprint at the full tolerance and live MoveIt validity both passed.
    stow_joint_positions:
      arm_shoulder_pan: 0.0092
      arm_shoulder_lift: -1.7967
      arm_elbow_flex: 1.6249
      arm_wrist_flex: 1.2306
      arm_wrist_roll: -0.0077
      arm_gripper: 0.2161
  '0.30':
    linear_speed_m_s: 0.30
    angular_speed_rad_s: 0.60
