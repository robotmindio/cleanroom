# Gazebo task scenes (lekiwi_rmf/sim_scene.py): an experimental environment for motor skills.
# Each scene names its world, what the simulator models, the robot's start, the arm's start
# (an SRDF arm group state), and its objects with nominal poses and seeded randomization.
# A reset puts the arm in its start state through the guarded trajectory path, places every
# object at the trial's deterministic pose and confirms the whole initial state from the
# simulator's ground truth; an unconfirmed reset makes the trial invalid, never a new origin.
# Sim results are labeled `domain: sim` and never promote a skill (scripts/register-skill.py).
scenes:
  floor_block:
    world: cleanroom
    description: one light block on the floor in front of the spawned robot
    # Variables this simulator reproduces; a success predicate needs every variable it reads.
    modeled: [rigid_geometry, articulation, friction_contact]
    seed: 20261019
    settle_sec: 1.5
    tolerance: {position_m: 0.02, yaw_rad: 0.1, joint_rad: 0.02, robot_position_m: 0.05, robot_yaw_rad: 0.05}
    robot: {model: lekiwi_1, start: [-4.0, -2.5, 0.0], arm_start: travel_stow}
    objects:
      block:
        shape: box
        size: [0.03, 0.03, 0.03]
        mass: 0.02
        color: [0.85, 0.2, 0.15, 1.0]
        friction: 1.0
        pose: [-3.72, -2.5, 0.015, 0.0]
        randomize: {x: 0.02, y: 0.03, yaw: 0.5}
