# mDNS follows the compute host on the LAN, without a fixed DHCP address.
server andres-Lenovo.local iburst minpoll 2 maxpoll 3 xleave prefer
# Preserve the same reference across compute Wi-Fi/DHCP changes.
server 100.87.252.60 iburst minpoll 2 maxpoll 3
driftfile /var/lib/chrony/chrony.drift
rtcsync
# Keep the shared reference: do not fall back to an independent public source.
# Slew corrections: clock steps can invalidate live sensor timestamps.
