name: ROS Jazzy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    steps:
      # Actions are pinned to commit SHAs; the comment names the release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install build and validation tools
        run: |
          apt-get update
          apt-get install -y \
            libxml2-utils \
            python3-coverage \
            python3-opencv \
            python3-pip \
            python3-pytest \
            python3-yaml \
            python3-zmq \
            shellcheck \
            ros-jazzy-launch-testing-ament-cmake \
            ros-jazzy-xacro
          python3 -m pip install --break-system-packages ruff==0.15.9
          rosdep update
          # Free Fleet, Astra, and the LD06 driver are pinned and built by the
          # repository installer; none is an apt/rosdep package or needed to
          # compile this package.
          rosdep install --from-paths . --ignore-src --rosdistro jazzy -y \
            --skip-keys "free_fleet_adapter astra_camera ldlidar_stl_ros2"
      - name: Build and test
        env:
          # CTest gives each DDS test its own free domain (ament_cmake_ros
          # isolation, domains 1-100); this covers the build's other processes.
          ROS_DOMAIN_ID: 221
        run: |
          . /opt/ros/jazzy/setup.sh
          # The container runs as root while checkout files belong to the runner.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # CTest freezes build-time package/library paths. Build the patched
          # overlay before configuring this package so tests use those binaries.
          mkdir -p install
          printf 'source /opt/ros/jazzy/setup.bash\n' > install/setup.bash
          LEKIWI_WS="$GITHUB_WORKSPACE" scripts/build-native.sh
          . install/setup.sh
          colcon build --packages-select lekiwi_rmf --symlink-install --event-handlers console_cohesion+
          . install/setup.sh
          colcon test --packages-select lekiwi_rmf --event-handlers console_cohesion+
          colcon test-result --verbose
      - name: Device-only package build and tests
        run: |
          . /opt/ros/jazzy/setup.sh
          device_workspace="$GITHUB_WORKSPACE/.benchmarks/device"
          colcon --log-base "$device_workspace/log" build \
            --base-paths "$GITHUB_WORKSPACE" --packages-select lekiwi_rmf \
            --build-base "$device_workspace/build" --install-base "$device_workspace/install" \
            --cmake-args -DLEKIWI_BUILD_COMPUTE=OFF -DBUILD_TESTING=ON
          . "$device_workspace/install/setup.sh"
          ctest --test-dir "$device_workspace/build/lekiwi_rmf" --output-on-failure
      - name: Static repository validation
        run: |
          . /opt/ros/jazzy/setup.sh
          set -euo pipefail
          xacro urdf/lekiwi.urdf.xacro sim:=true >/tmp/lekiwi.urdf
          xacro urdf/lekiwi.urdf.xacro sim:=false >/tmp/lekiwi-real.urdf
          test -s /tmp/lekiwi.urdf
          test -s /tmp/lekiwi-real.urdf
          check_urdf /tmp/lekiwi.urdf
          check_urdf /tmp/lekiwi-real.urdf
          xmllint --noout package.xml
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted((*Path('config').glob('*.yaml'), *Path('maps').rglob('*.yaml'))):
              with path.open(encoding='utf-8') as stream:
                  yaml.safe_load(stream)
          PY
          python3 -m compileall -q lekiwi_rmf scripts test
          ament_flake8 --config config/flake8.ini lekiwi_rmf scripts test
          ruff check --config config/ruff.toml lekiwi_rmf scripts test
          non_executable=$(find scripts -type f \
            \( -name '*.py' -o -name '*.sh' -o -name '*.bash' \) \
            ! -perm /111 -print -quit)
          if [ -n "$non_executable" ]; then
            echo "installed script source is not executable: $non_executable" >&2
            exit 1
          fi
          find scripts -type f \( -name '*.sh' -o -name '*.bash' \) -print0 |
            xargs -0 -r shellcheck
      - name: Python coverage report
        env:
          # Cyclone DDS derives UDP ports from the domain ID, so it must stay
          # at or below 232. 221 is outside the isolated CTest domains (1-100).
          ROS_DOMAIN_ID: 221
        run: |
          . /opt/ros/jazzy/setup.sh
          . install/setup.sh
          set -euo pipefail
          mapfile -t unit_tests < <(
            find test -maxdepth 1 -type f -name 'test_*.py' ! -name '*_launch.py' -print | sort
          )
          PYTHONPATH="$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}" \
            python3 -m coverage run --source=lekiwi_rmf -m pytest -q "${unit_tests[@]}"
          # The measured total was 52.9%; raise the floor as tests are added.
          python3 -m coverage report --fail-under=52
