# ROS 2 keeps one log per process plus launch logs.  Cyclone DDS transport
# failures can otherwise fill a disk in hours.  Archives are compressed at once:
# a launch directory is never rotated again after its launch ends, so a delayed
# compression would leave its newest archive uncompressed until the age pruning
# in lekiwi-ros-logrotate.service removes it.
@SERVICE_HOME@/.ros/log/*.log @SERVICE_HOME@/.ros/log/20*/*.log {
    hourly
    maxsize 100M
    rotate 12
    missingok
    notifempty
    compress
    copytruncate
}
