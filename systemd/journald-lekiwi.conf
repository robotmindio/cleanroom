# Installed as /etc/systemd/journald.conf.d/lekiwi.conf by
# scripts/lib/service-install-common.sh (install_disk_hygiene). Without a cap a
# persistent journal grows to 10% of the filesystem -- 5.7 GB on the robot's
# 58 GB card, next to everything else it needs. A week of service history is
# what an operator debugs with; the ROS logs and the task journal hold the rest.
[Journal]
Storage=persistent
SystemMaxUse=512M
SystemMaxFileSize=64M
# Hand space back before the filesystem itself is out: the robot must keep
# working when another workload fills the disk.
SystemKeepFree=1G
RuntimeMaxUse=128M
MaxRetentionSec=2week
